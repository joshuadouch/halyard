name: Release
# Every merge to main that changes the app publishes a release, so
# `halyard-update` on a node picks it up. Scripts and docs are served straight
# from main and do not need a release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "ct/**"
      - "install/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq haproxy
      - name: Version
        id: v
        run: echo "tag=v$(tr -d '[:space:]' < VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - run: go test ./...
      - run: make release VERSION=${{ steps.v.outputs.tag }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.tag }}" dist/* --target "$GITHUB_SHA" --generate-notes
